
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Weather Application</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            color: #333;
        }

        h2 {
            color: white;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 22px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        form {
            display: flex;
            gap: 12px;
            margin-bottom: 35px;
            width: 100%;
            max-width: 430px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 14px 18px;
            border: 2px solid transparent;
            border-radius: 12px;
            outline: none;
            background: white;
            color: #333;
            font-size: 15px;
            transition: 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.2);
        }

        input::placeholder {
            color: #999;
        }

        button {
            padding: 14px 20px;
            border: none;
            background: #263c91;
            color: white;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            white-space: nowrap;
        }

        button:hover {
            background: #172967;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        div {
            background: white;
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 430px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
            transition: 0.3s ease;
        }

        div:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(0,0,0,0.22);
        }

        h3 {
            color: #263c91;
            font-size: 23px;
            margin-bottom: 22px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e8eaf0;
        }

        p {
            font-size: 16px;
            color: #555;
            padding: 13px 15px;
            margin-bottom: 12px;
            background: #f5f6ff;
            border-radius: 10px;
            font-weight: 500;
        }

        span {
            font-size: 16px;
            color: #263c91;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            h2 {
                font-size: 25px;
            }

            form {
                gap: 8px;
            }

            input[type="text"] {
                padding: 12px;
                font-size: 14px;
            }

            button {
                padding: 12px;
                font-size: 13px;
            }

            div {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

<h2>Weather App</h2>

<form action="/weather" method="get">

    <input type="text" name="city" required placeholder="Enter city"/>

    <button type="submit">Get Weather</button>

</form>

<h2>Weather Details</h2>

<div th:if="${weather}">

    <h3>City: <span th:text="${weather.name}"></span></h3>

    <p>Temperature: <span th:text="${weather.main.temp}"></span></p>

    <p>Humidity: <span th:text="${weather.main.humidity}"></span></p>

    <p>Description: <span th:text="${weather.weather[0].description}"></span></p>

</div>

</body>
</html>
